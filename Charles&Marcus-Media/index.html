<body>

  <header>
    <h1>Week 9 Lab: Embedded Media</h1>
    <!-- TODO: put your names here -->
    <p>By: Charles Izzo &amp; PARTNER NAME</p>
  </header>

  <main>

    <!-- ===== YOUTUBE VIDEO ===== -->
    <section id="video">
      <h2>Our Video</h2>
      <!-- TODO: write 1-2 sentences about the video you picked -->
      <p>VIDEO DESCRIPTION</p>

      <!--
        TODO: replace VIDEO_ID with the ID from your YouTube link.
        Example: https://www.youtube.com/watch?v=tgbNymZ7vqY  ->  VIDEO_ID = tgbNymZ7vqY
        (Or on YouTube: Share > Embed, and copy the src URL.)
      -->
      <iframe width="560" height="315" src="https://www.youtube.com/embed/hSOTq3gWWQI?si=bwsinbT_AkFNoN0Z" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>


    </section>

    <!-- ===== AUDIO RECORDING ===== -->
    <section id="audio">
      <h2>Our Conversation</h2>
      <!-- TODO: write 1 sentence about your recording -->
      <p>AUDIO DESCRIPTION</p>

      <!--
        TODO: put your recording in the assets folder and name it conversation.mp3
        (must be MP3, WAV, or OGG - phone recordings are often .m4a, so convert it first).
        If you use .wav, change both the file name and type="audio/wav".
      -->
      <audio controls>
        <source src="assets/conversation.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
      </audio>
    </section>

  </main>

</body>
